# ==============================================================================
# CRAFTBID PRODUCTION PROFILE CONFIGURATION
# Activated via: SPRING_PROFILES_ACTIVE=prod or -Dspring.profiles.active=prod
# ==============================================================================

# Database Migration Strategy: Flyway manages and versions all schema updates
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Hibernate Schema Strategy: Strictly VALIDATE schema against JPA entities (Never alters production schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
