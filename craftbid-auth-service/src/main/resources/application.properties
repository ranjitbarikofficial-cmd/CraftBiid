spring.application.name=craftbid-auth-service

# Port (Render injects $PORT dynamically, defaults to 8081 locally)
server.port=${PORT:8081}

# Database Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/craftbid_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ranjitbarik}

# JPA & Hibernate Explicit MySQL Dialect Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Disable Flyway (JPA handles all entity schemas automatically)
spring.flyway.enabled=false

# Hikari Connection Pool Settings for Cloud (Aiven)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# High-Speed Transactional Email Configuration (Google SMTP Primary)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:craftbid.official@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:toyekvrmhrmunicr}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

craftbid.admin.email=${CRAFTBID_ADMIN_EMAIL:craftbid.official@gmail.com}
craftbid.mail.from=${SPRING_MAIL_FROM:craftbid.official@gmail.com}
craftbid.brevo.api-key=${BREVO_API_KEY:}
craftbid.brevo.sender-email=${BREVO_SENDER_EMAIL:ranjitbarik146@gmail.com}
craftbid.resend.api-key=${RESEND_API_KEY:}
craftbid.email.webhook-url=${CRAFTBID_EMAIL_WEBHOOK_URL:}

file.upload-dir=uploads

# Multipart File Upload Limits (Images up to 10MB, Videos up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
spring.servlet.multipart.enabled=true