spring.application.name=craftbid-auth-service

# Port (Render injects $PORT dynamically, defaults to 8081 locally)
server.port=${PORT:8081}

# Database Datasource (Uses Aiven / Cloud MySQL when deployed, localhost locally)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/craftbid_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ranjitbarik}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=craftbid.official@gmail.com
spring.mail.password=toyekvrmhrmunicr

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
craftbid.admin.email=craftbid.official@gmail.com
file.upload-dir=uploads

# Multipart File Upload Limits (Images up to 10MB, Videos up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
spring.servlet.multipart.enabled=true