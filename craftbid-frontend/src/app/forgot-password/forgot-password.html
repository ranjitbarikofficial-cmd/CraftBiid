<div class="auth-page-container">
  <div class="auth-center-card">
    
    <div class="brand-header">
      <a routerLink="/home" class="brand-logo-pill">
        <span class="brand-logo-icon">🏺</span>
        <span class="brand-logo-text">CraftBid</span>
      </a>
    </div>

    <div class="otp-card-body">
      <div class="icon-bubble">
        <span>🔑</span>
      </div>

      <h1 class="card-title">Reset Your Password</h1>
      <p class="card-subtitle">
        Enter your registered email address and we'll send you a 6-digit OTP to reset your password.
      </p>

      <!-- ALERTS -->
      @if (errorMessage) {
        <div class="auth-alert error">
          <span class="alert-icon">⚠️</span>
          <span>{{ errorMessage }}</span>
        </div>
      }

      @if (successMessage) {
        <div class="auth-alert success">
          <span class="alert-icon">✅</span>
          <span>{{ successMessage }}</span>
        </div>
      }

      <form (ngSubmit)="sendOtp()" class="otp-form">
        <div class="auth-input-group">
          <label for="reset-email">Registered Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              id="reset-email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="name@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <button type="submit" class="btn-primary-auth" [disabled]="loading">
          @if (loading) {
            <span class="btn-spinner"></span>
            <span>Sending Reset Code...</span>
          } @else {
            <span>Send Reset Code →</span>
          }
        </button>
      </form>

      <div class="card-footer">
        <p>Remembered your password? <a routerLink="/login" class="link-highlight">Back to Login</a></p>
      </div>

    </div>

  </div>
</div>
