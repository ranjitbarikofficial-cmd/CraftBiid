<div class="auth-page-container">
  <div class="auth-center-card">
    
    <div class="brand-header">
      <a routerLink="/home" class="brand-logo-pill">
        <span class="brand-logo-icon">🏺</span>
        <span class="brand-logo-text">CraftBid</span>
      </a>
    </div>

    <div class="otp-card-body">
      <div class="icon-bubble">
        <span>🛡️</span>
      </div>

      <h1 class="card-title">Set New Password</h1>
      <p class="card-subtitle">
        Create a new, strong password for account<br />
        <strong class="highlight-identifier">{{ email }}</strong>
      </p>

      <!-- ALERTS -->
      @if (errorMessage) {
        <div class="auth-alert error">
          <span class="alert-icon">⚠️</span>
          <span>{{ errorMessage }}</span>
        </div>
      }

      @if (successMessage) {
        <div class="auth-alert success">
          <span class="alert-icon">✅</span>
          <span>{{ successMessage }}</span>
        </div>
      }

      <form (ngSubmit)="resetPassword()" class="otp-form">
        <!-- New Password -->
        <div class="auth-input-group">
          <label for="new-pass-input">New Password (Min. 6 chars)</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              id="new-pass-input"
              [type]="showPassword ? 'text' : 'password'"
              name="newPassword"
              [(ngModel)]="newPassword"
              placeholder="Enter new password"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="btn-toggle-pwd"
              (click)="togglePasswordVisibility()"
              title="Show / Hide Password"
            >
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="auth-input-group">
          <label for="confirm-pass-input">Confirm New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              id="confirm-pass-input"
              [type]="showPassword ? 'text' : 'password'"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Re-enter new password"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
        </div>

        <button type="submit" class="btn-primary-auth" [disabled]="loading">
          @if (loading) {
            <span class="btn-spinner"></span>
            <span>Updating Password...</span>
          } @else {
            <span>Update Password & Log In →</span>
          }
        </button>
      </form>

      <div class="card-footer">
        <p>Remembered your password? <a routerLink="/login" class="link-highlight">Back to Login</a></p>
      </div>

    </div>

  </div>
</div>
